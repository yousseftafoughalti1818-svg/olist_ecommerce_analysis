[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-analysis"
version = "1.0.0"
description = "E-commerce sales analysis with SQL, Python and Power BI (Olist dataset)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Youssef Tafoughalti" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]
